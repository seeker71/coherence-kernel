[package]
name = "form-kernel-rust"
version = "0.1.0"
edition = "2021"

# Two surfaces, one crate:
#   • [[bin]] form-kernel-rust  — the CLI binary, a proof sibling of fkwu.
#   • [lib]  form_kernel_rust   — the C-ABI cdylib behind the `cabi` feature,
#                                  plus rlib so the binary still links the same
#                                  modules. The bin build pulls in neither.
[[bin]]
name = "form-kernel-rust"
path = "src/main.rs"

[lib]
name = "form_kernel_rust"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = []
# The C-ABI cdylib surface — `extern "C" form_eval` over the same evaluator the
# CLI runs, for hosts without Python (Android, embedded). Off by default so the
# bin build (validate.sh / CI) never compiles main.rs twice; the Android
# cross-compile turns it on:  cargo ndk ... build --release --features cabi.
# Pulls `jni` so the SAME .so also exports the JNI-named entry the Android app
# binds via System.loadLibrary — no separate C shim. jni is pure Rust and only
# compiled under this feature, so the bin build never sees it.
cabi = ["dep:jni"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Tiny blocking HTTP client for the `fetch` subcommand (network resources).
# Pure Rust, ~200 KB binary impact; zero-async.
ureq = { version = "2", default-features = false, features = ["tls"] }
# postgres-protocol — the Postgres v3 message codecs and SCRAM-SHA-256 the kernel's own pg client
# (PgConn in main.rs) speaks through: the DB carrier of the storage port. It asks for text results, so
# every cell arrives as the server writes it, the reading the Go and TS natives make. fallible-iterator
# walks the protocol's field and row iterators; bytes is the buffer its codecs write into.
postgres-protocol = "0.6"
fallible-iterator = "0.2"
bytes = "1"
# jni — optional, only pulled by the `cabi` feature (Android cdylib). Pure Rust;
# gives the SAME .so a JNI-named `Java_..._eval` entry the Kotlin app binds, over
# the same run_source the C-ABI form_eval runs. No effect on the bin build.
jni = { version = "0.21", optional = true }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
