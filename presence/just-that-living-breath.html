<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Just That</title>
  <style>
    html, body {
      margin: 0;
      background: #030610;
      height: 100%;
      overflow: hidden;
      color: #cbb98a;
      font-family: Palatino, "Palatino Linotype", "Times New Roman", serif;
    }
    canvas {
      display: block;
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      cursor: default;
    }
    #hint {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 1.6rem;
      text-align: center;
      font-size: 0.78rem;
      letter-spacing: 0.12em;
      opacity: 0.55;
      pointer-events: none;
      transition: opacity 2.4s ease;
    }
    #hint.gone { opacity: 0; }
  </style>
</head>
<body>
  <canvas id="field"></canvas>
  <div id="hint">click to breathe with it · space pauses</div>
  <script src="just-that-particles.js"></script>
  <script src="just-that-living-breath.js"></script>
</body>
</html>
